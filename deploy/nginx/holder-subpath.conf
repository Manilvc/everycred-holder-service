# EveryCRED Holder Service mounted on the shared backend domain under a
# sub-path, alongside the main backend (/) and the other services.
#
# External path map (nginx strips /holder; uvicorn runs with
# --root-path /holder, set by ROOT_PATH in docker-compose.yml):
#   https://<api-host>/holder/v1/...               -> the API
#   https://<api-host>/holder/health/live|ready    -> probes
#   https://<api-host>/holder/docs | /redoc        -> only when
#       ENABLE_DOCS=true and ENVIRONMENT is not production; 404 otherwise
#
# The container publishes 127.0.0.1:8041 only (see docker-compose.yml),
# so this location is the one public way in.

# 1. Put this upstream at the top of the site's nginx config, outside any
#    server { } block (upstream is only valid in the http context).
upstream holder_api {
    server 127.0.0.1:8041;
    keepalive 32;
}

# 2. Paste the blocks below inside the existing `listen 443 ssl` server
#    block of the API host. Do not create a second server block.

# Bare /holder has no trailing slash and would not match the prefix
# location below.
location = /holder {
    return 301 /holder/;
}

location /holder/ {
    # The trailing slash on proxy_pass strips the /holder prefix:
    #   /holder/v1/holders/me  ->  /v1/holders/me
    # Keep in sync with ROOT_PATH=/holder in docker-compose.yml.
    proxy_pass http://holder_api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /holder;

    # Profile images (2 MB) and presentations (1 MB) are the largest
    # uploads; the service enforces the exact limits itself.
    client_max_body_size 3m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # Above CONNECTOR_TIMEOUT_SECONDS (15 by default) so a slow connector
    # call ends with the service's own 502, not an nginx 504.
    proxy_read_timeout    45s;
}
