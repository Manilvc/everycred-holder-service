# Push notifications with the Firebase service account key kept as a file
# on the host (it never goes into .env).
#
# Only the worker sends pushes, so only it gets the key, mounted read-only
# at a fixed path. Enable it by adding these lines to .env (compose reads
# COMPOSE_FILE from there; the service settings come from the same file):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.fcm.yml
#   FCM_SERVICE_ACCOUNT_HOST_FILE=/etc/everycred/secrets/firebase-sa.json
#   FCM_PROJECT_ID=<firebase project id>
#   FCM_SERVICE_ACCOUNT_FILE=/run/secrets/firebase-sa.json
# and leave FCM_SERVICE_ACCOUNT_JSON unset. FCM_SERVICE_ACCOUNT_FILE is the
# path inside the container (the target below), not the host path. With
# the MySQL socket override too, list all three files:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.mysql-socket.yml:docker-compose.fcm.yml
#
# The container runs as uid 10001, which must be able to read the file:
#   sudo chown 10001 /etc/everycred/secrets/firebase-sa.json
#   sudo chmod 400 /etc/everycred/secrets/firebase-sa.json

services:
  worker:
    volumes:
      - type: bind
        source: ${FCM_SERVICE_ACCOUNT_HOST_FILE:?Set FCM_SERVICE_ACCOUNT_HOST_FILE in .env}
        target: /run/secrets/firebase-sa.json
        read_only: true
